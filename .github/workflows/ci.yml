# AuditCore — CI PRODUIT : gate de merge = lint d'agnosticité (N1/N2 core + N0 repo-wide)
# + batterie complète 100 % synthétique. Ce dépôt ne connaît aucun tenant réel : la logique
# de fusion est prouvée par le golden-test ; l'iso-comportement d'un tenant réel se rejoue
# dans le dépôt de son engagement.
name: auditcore-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  batterie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 (LTS) et non 20 : le tirage PDF de la fiche securite pilote le moteur
      # d impression par le protocole DevTools, qui passe par un WebSocket. Node 22 lexpose
      # nativement ; sur Node 20 il faut --experimental-websocket, et lauto-test se degraderait
      # en SKIP MOTIVE — la mesure de preferCSSPageSize ne serait plus jouee en integration,
      # donc plus protegee. Un controle saute nest pas un controle vert.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances outillage
        run: npm ci || npm install

      - name: Lint agnosticité v2 (N1/N2 normatif + N0 repo-wide, 0 finding exigé)
        run: node tools/lint-agnostic.mjs

      - name: Validation tenants (exemple + fixture)
        run: |
          node tools/validate-config.mjs config/tenants/exemple/tenant.yaml --quiet
          node tools/validate-config.mjs tests/fixtures/tenant-valid-min.yaml --quiet

      - name: Fixtures invalides rejetées (5/5)
        run: |
          for f in tests/fixtures/tenant-invalid-*.yaml; do
            if node tools/validate-config.mjs "$f" --quiet > /dev/null 2>&1; then
              echo "REGRESSION: $f accepté"; exit 1
            fi
          done
          echo "5/5 fixtures invalides rejetées"

      - name: Golden-test buckets + juridictions (synthétique)
        run: node tests/test-golden-buckets.mjs

      - name: Vérificateur de rapport (valide ✔ / invalide ✖)
        run: |
          node tools/verifier-rapport.mjs tests/fixtures/rapport-data-valid.json
          if node tools/verifier-rapport.mjs tests/fixtures/rapport-data-invalid.json > /dev/null 2>&1; then
            echo "REGRESSION: rapport invalide accepté"; exit 1
          fi
          # TF-1001 : un titre qui répète le libellé de document ajouté par le moteur
          # (« Digit-AI — Rapport d'audit — Rapport d'audit - Produit-61 », mesuré le 09/09) doit
          # être REFUSÉ — même quand les autres champs de rapport-data.json sont par ailleurs valides.
          if node tools/verifier-rapport.mjs tests/fixtures/rapport-data-titre-duplique.json > /dev/null 2>&1; then
            echo "REGRESSION: titre dédoublé accepté"; exit 1
          fi
          # TF-0940 — le contrat `db_schema` étendu (role, style, card, tip) est VALIDÉ : la fixture
          # riche le renseigne et passe ; celle qui porte un style hors palette et un rôle non
          # textuel est REFUSÉE. Un style inconnu serait ramené au neutre par l'adaptateur, et
          # l'audit croirait avoir classé une table qui ne l'est pas.
          node tools/verifier-rapport.mjs tests/fixtures/rapport-data-riche.json
          if node tools/verifier-rapport.mjs tests/fixtures/rapport-data-db-schema-invalid.json > /dev/null 2>&1; then
            echo "REGRESSION: db_schema hors contrat accepté"; exit 1
          fi

      - name: Kits marque-blanche (2 tenants fictifs)
        run: |
          node tools/build-kit.mjs config/tenants/exemple/tenant.yaml --kind both
          node tools/build-kit.mjs tests/fixtures/tenant-valid-min.yaml --kind both

      # TF-1000 : un rapport client rendu dans la police d'une charte FICTIVE — DESIGN.md
      # (reliquat de scaffold) écrasait silencieusement une typographie pourtant déclarée
      # explicitement dans tenant.yaml. Auto-test à double sens : la déclaration explicite
      # gagne (rouge rejoué) ET le repli sur DESIGN.md reste intact sans elle (vert).
      - name: Thème — priorité de la typographie explicite du tenant (TF-1000)
        run: node tools/build-theme.mjs --self-test

      # TF-0940 (étape 0, 20/09/2026) : le CHEMIN ERD du moteur n'était rendu par AUCUN contrôle
      # automatique. `rapport-data-valid.json` ne porte pas de `db_schema`, et `rapport-data-riche.json`
      # — la seule fixture qui en porte un — n'était consommée par personne (mesuré : zéro occurrence
      # dans tout le dépôt). Le schéma de base de données et son dictionnaire se rendaient donc sans
      # juge, et une bascule de moteur n'aurait eu aucun « avant » à ne pas régresser. Cette fixture
      # entre ici, et sa sortie passe le gate de rendu comme l'autre.
      - name: Rendu rapport + catalogue (moteurs M5/M7)
        run: |
          node tools/build-rapport.mjs tests/fixtures/rapport-data-valid.json --tenant config/tenants/exemple/tenant.yaml --out /tmp/rapport.html
          node tools/build-rapport.mjs tests/fixtures/rapport-data-riche.json --tenant config/tenants/exemple/tenant.yaml --out /tmp/rapport-riche.html
          node tools/build-catalogue.mjs config/tenants/exemple/tenant.yaml --out /tmp/catalogue.html
          grep -q 'id="v-regles"' /tmp/rapport.html && grep -q "Catalogue ADR" /tmp/catalogue.html
          # La vue « Architecture & BDD » EXISTE dans le rendu riche (assertion neutre au moteur :
          # elle survit à la bascule de TF-0940) et son dictionnaire porte le marquage PII.
          grep -q 'id="v-schemas"' /tmp/rapport-riche.html && grep -q 'PII 🔒' /tmp/rapport-riche.html

      # Le rendu produit passe son PROPRE gate : contrat de restitution (vues appariées au
      # sommaire, KPI complets, manifeste d'écarts, tableaux longs filtrables) ET moteur JS
      # compilé, exécuté, chaque vue pilotée. Un rendu qui casse au clic sort 1 ici.
      - name: Parité FR/EN des gabarits (TF-0563 — un champ d'un seul côté est un champ absent)
        run: |
          node oracles/verifier-parite-gabarits.mjs --self-test
          node oracles/verifier-parite-gabarits.mjs

      # TF-0701 : le rapport d'audit avait une porte bloquante, la fiche sécurité n'en avait
      # aucune — alors que ses règles écrites sont mécaniques, et que ce qui est DIFFUSÉ (le PDF)
      # n'était relu par personne. TF-0700 : le PDF doit être IMPRIMÉ, jamais capturé, et le
      # drapeau `preferCSSPageSize` est mesuré par l'auto-test (sans lui, le @page du gabarit est
      # jeté). Les deux auto-tests portent leurs fixtures rouge ET verte.
      - name: Portes de la fiche sécurité (auto-tests à double sens — TF-0700 / TF-0701)
        run: |
          node oracles/verifier-fiche-securite.mjs --self-test
          node tools/fiche-en-pdf.mjs --self-test

      # TF-0940 — LA COPIE CONFORME NE DOIT PAS DÉRIVER DE SA SOURCE. `HERITAGE.json` déclare ce
      # que ce dépôt a copié du canevas de digit-ai-schemas et sur quelle version. Sur un runner,
      # le dépôt frère n'est pas cloné : le contrôle se déclare alors SKIP NOMMÉ et sort 0 — un
      # dépôt absent est une mesure qu'on n'a pas pu faire, jamais un rouge d'environnement.
      # L'auto-test, lui, est DUR partout : il joue la dérive dans les deux sens, sans dépôt frère,
      # et prouve que l'empreinte ne bouge pas quand seules les fins de ligne changent (CRLF).
      - name: Héritage — copies conformes et dérive (auto-test dur, comparaison si la source est là)
        run: |
          node tools/verifier-heritage.mjs --self-test
          node tools/verifier-heritage.mjs

      - name: Gate de rendu du rapport (restitution + moteur exécuté)
        run: |
          node tools/verifier-rapport-html.mjs /tmp/rapport.html
          # TF-0940 (étape 0) : le rendu QUI PORTE UN SCHÉMA DE BASE passe le même gate — c'est là
          # que vit le contrôle de cohérence ERD/dictionnaire, qui ne s'exerçait sur rien.
          node tools/verifier-rapport-html.mjs /tmp/rapport-riche.html

  # ── Oracles PROJET (ECR-01/03) : contrôles exécutés contre le système audité.
  # Matrice {ubuntu, windows} exigée : `runCmd` porte des gardes spécifiques Windows
  # (shell pour les `.cmd` → EINVAL, maxBuffer → ENOBUFS). Une régression y est invisible
  # sur un seul OS — c'est précisément ce qui avait coûté trois versions avant le figeage.
  oracles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node 22 (LTS) et non 20 : le tirage PDF de la fiche securite pilote le moteur
      # d impression par le protocole DevTools, qui passe par un WebSocket. Node 22 lexpose
      # nativement ; sur Node 20 il faut --experimental-websocket, et lauto-test se degraderait
      # en SKIP MOTIVE — la mesure de preferCSSPageSize ne serait plus jouee en integration,
      # donc plus protegee. Un controle saute nest pas un controle vert.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dépendances outillage
        run: npm ci || npm install

      - name: Batterie des oracles (151 tests — projet, rendu du rapport, porte de clôture)
        # TF-0553 (24/08) : les DEUX ensembles etaient disjoints DANS LES DEUX SENS. La CI jouait
        # sept fichiers d'oracles, le `npm test` local en jouait deux AUTRES — build-fiche-destination
        # et verifier-pdf n'etaient donc joues par AUCUNE chaine automatique. Ils entrent ici, et le
        # `npm test` local rejoue desormais ce workflow au lieu d'en tenir sa propre liste.
        run: node --test tests/oracles/audit-runtime.test.mjs tests/oracles/build-fiche-destination.test.mjs tests/oracles/couverture-fonctionnelle.test.mjs tests/oracles/dependances-env.test.mjs tests/oracles/fiche-securite.test.mjs tests/oracles/maj-versions.test.mjs tests/oracles/remediation.test.mjs tests/oracles/roundtrip.test.mjs tests/oracles/verifier-pdf.test.mjs tests/oracles/verifier-rapport-html.test.mjs tests/oracles/modele-semantique.test.mjs tests/oracles/rapport-pbir.test.mjs tests/oracles/canevas-modele-donnees.test.mjs tests/oracles/couverture-plan.test.mjs tests/oracles/recette-environnement.test.mjs tests/oracles/verifier-referentiel.test.mjs
