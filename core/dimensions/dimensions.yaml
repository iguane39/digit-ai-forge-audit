# AuditCore — dimensions d'audit core (invariant: les 18 dimensions et 6 familles
# ne sont ni supprimables ni fusionnables par overlay ; relabel cosmétique autorisé).
# D17 ajoutée le 2026-08-12 (TF-0110, PADR-0009) — évolution additive, aucun retrait.
# Source : généralisation du référentiel D00-D16 du profil de référence (PLAN/04 §1).
pack: core-v1
invariant: true
families:
  - { key: fonctionnel, label: "Fonctionnel", label_en: "Functional" }
  - { key: architecture, label: "Architecture", label_en: "Architecture" }
  - { key: securite, label: "Sécurité", label_en: "Security" }
  - { key: donnees-ia, label: "Données & IA", label_en: "Data & AI" }
  - { key: finops, label: "FinOps", label_en: "FinOps" }
  - { key: operations, label: "Opérations", label_en: "Operations" }
scoring:
  scale: { 1: "Bloquant", 2: "Insuffisant", 3: "Acceptable", 4: "Solide", 5: "État de l'art" }
  rule: "pas de score sans preuve"          # invariant
  global: "moyenne pondérée sur les 17 dimensions"
  blockers: "dimensions notées <= 2 ou criticité Fatal"
gates:
  - { key: gate1a, label: "Revue consultative", decision: false }
  - { key: gate1b, label: "Gate décisionnelle", decision: true, authority_role: decision_authority, verdicts: [nogo, reserve, go] }
verdict_rule: [conforme, partiel, non_conforme, sans_objet, a_evaluer]
enforcement_levels: [blocking, required, advisory, recommendation]
criticites: [Fatal, Bloquant, Majeur, Standard]
action_tags: [urgent, prio, quick, norm]
project_types: [web-app, api, data, mobile, ml, infra]
# applicability: ✓ = plein, partial = sous-ensemble, off = sans objet par défaut (motif auto)
dimensions:
  - { id: D00, label: "Périmètre fonctionnel & valeur métier", label_en: "Functional scope & business value", family: fonctionnel, themes: 9,
      applicability: { web-app: full, api: full, data: full, mobile: full, ml: full, infra: full } }
  - { id: D01, label: "Architecture cible", label_en: "Target architecture", family: architecture, themes: 10,
      applicability: { web-app: full, api: full, data: full, mobile: full, ml: full, infra: full } }
  - { id: D02, label: "Sécurité applicative", label_en: "Application security", family: securite, themes: 10,
      applicability: { web-app: full, api: full, data: partial, mobile: full, ml: partial, infra: partial } }
  - { id: D03, label: "IAM & gestion des secrets", label_en: "IAM & secrets management", family: securite, themes: 9,
