        diffusables aux autres équipes.
  D16:
    libelle_courant: Schéma de base de données
    libelle_source: Schéma de base de données
    appariement: exact
    famille_courante: donnees-ia
    description: >-
      Évalue le modèle physique de la base : inventaire des tables et relations, clés et intégrité
      référentielle, index et performance d'accès, types et contraintes, normalisation, classification des
      données personnelles, alignement entre le modèle ORM et le schéma réel, migrations et versioning de
      schéma, documentation (dictionnaire de données). Alimente la page « Schéma de base de données » du
      rapport d'audit.
    raison_d_etre: >-
      Pour une application CRUD, le schéma de la base est le socle de la valeur métier, de la performance et
      de la conformité. Un schéma non documenté, sans intégrité référentielle ni index, avec des données
      personnelles non classifiées, est une dette structurelle invisible : elle ne se voit pas tant que la
      volumétrie est faible, puis devient bloquante (lenteurs, orphelins, fuites RGPD, migrations risquées).
      Ce domaine donne au RUN et à la Design Authority une vue partagée et auditable du patrimoine de données
      persistées.
    themes:
      - titre: Inventaire des tables & relations
        points:
          - Liste exhaustive des tables (schéma applicatif et schémas tiers consommés)
          - Cardinalités et relations entre tables (1-1, 1-N, N-N)
          - Tables de référentiel vs tables de cœur métier vs tables techniques
          - Schéma ERD présent, à jour ou absent
      - titre: Clés & intégrité référentielle
        points:
          - Clés primaires de chaque table (naturelle vs technique/surrogate)
          - Clés étrangères déclarées et contraintes ON DELETE/UPDATE
          - >-
            Références logiques NON contraintes (chaînes libres pointant une autre table sans FK) — risque
            d'orphelins
          - Clés naturelles / unicité métier (ex. business_key) et leur protection
      - titre: Index & performance d'accès
        points:
          - Index présents vs colonnes réellement filtrées/jointes/triées (cohérent avec D06)
          - Index composites, partiels, GIN/GiST (JSONB, géométrie PostGIS)
          - Colonnes de jointure et de filtre non indexées
      - titre: Types, contraintes & normalisation
        points:
          - Types adaptés (dates timezone-aware, numériques, enum vs varchar libre)
          - Contraintes NOT NULL / CHECK / UNIQUE cohérentes avec les règles métier
          - Champs dénormalisés (tableaux, JSON libre) et justification
          - Niveau de normalisation (redondances, anomalies de mise à jour)
      - titre: Données personnelles & classification
        points:
          - Colonnes contenant des données personnelles ou sensibles (cohérent avec D04/D15)
          - Classification par colonne (publique / interne / confidentielle / secret)
          - Chiffrement au repos, pseudonymisation, masquage applicatif
          - Politique de rétention au niveau table (purge, archivage)
      - titre: Alignement ORM ↔ schéma physique
        points:
          - Cohérence entre les modèles applicatifs (ORM) et le schéma réel en base
          - Colonnes présentes en base mais absentes du modèle (ou inverse)
          - Source de vérité du schéma (migrations vs base vivante)
      - titre: Migrations & versioning de schéma
        points:
          - Outil de migration versionné (Alembic, Flyway, équivalent) présent ou absent
          - Scripts de migration ad hoc, idempotence, réversibilité
          - Secrets/credentials dans les scripts de migration
      - titre: Rétention, cycle de vie & volumétrie
        points:
          - Volumétrie actuelle et projetée par table
          - Stratégie d'archivage/purge alignée sur les contraintes légales
          - Historisation et soft-delete vs suppression physique
      - titre: Documentation (dictionnaire de données)
        points:
          - Dictionnaire de données (table, colonne, type, description, propriétaire)
          - MCD/MLD validés par un Data Architect (cohérent avec D15)
          - Conventions de nommage et schémas applicatifs documentés
    preuves:
      - type: CODE
        description: Modèles ORM (SQLAlchemy/équivalent) — déclaration des tables, colonnes, clés, index
      - type: DB
        description: Introspection de la base (information_schema, pg_indexes, pg_constraint) — schéma réel
      - type: DOC
        description: ERD / MCD / MLD / dictionnaire de données (présents, à jour ou à produire)
      - type: GIT
        description: Scripts et historique de migrations de schéma
      - type: MANUEL
        description: Revue de cohérence ORM↔base, recherche des références logiques non contraintes et des PII
      - type: DB
        description: >-
          Conformité schéma opposable (référentiel interne) : nommage catalogue technique de la plateforme
          data catalog_any_<layer>_<env_code> + lower_snake_case (ADR0603), colonnes techniques de traçabilité
          + hash (ADR0602), couche Application (ADR0625), BDD managée moteur relationnel managé/moteur
          relationnel managé (ADR0626)
    livrables:
      - Schéma ERD à jour (tables, colonnes, clés, relations) — pivot pour D05/D06/D15
      - Dictionnaire de données complet avec classification de sensibilité par colonne
      - Plan d'indexation aligné sur les requêtes réelles (cohérent avec D06)
      - Mise en place d'un outil de migration de schéma versionné (Alembic) et purge des secrets des scripts
      - Déclaration des clés étrangères manquantes et traitement des références logiques (orphelins)
      - Alignement du modèle ORM avec le schéma physique (colonnes manquantes)
    bareme:
      '1': >-
        Schéma non documenté, aucune ERD, intégrité référentielle quasi absente (références logiques non
        contraintes), aucun index hors clés primaires, données personnelles non identifiées, migrations ad hoc
        avec secrets en dur. Le modèle n'est ni auditable ni industrialisable.
      '2': >-
        Schéma reconstituable via le code mais non documenté ; quelques clés/contraintes présentes, indexation
        très partielle, PII non classifiées, ORM partiellement désaligné du réel, pas d'outil de migration.
        Reprise du modèle nécessaire avant montée en charge.
      '3': >-
        Modèle correct : clés primaires et principales FK en place, index sur les accès majeurs, types
        adaptés, ERD et dictionnaire partiels. PII identifiées mais classification à finaliser. Migrations
        outillées en cours. Industrialisable avec compléments.
      '4': >-
        Modèle solide : intégrité référentielle complète, indexation alignée sur les requêtes, normalisation
        maîtrisée, dictionnaire de données et ERD à jour, PII classifiées, migrations versionnées et
        réversibles. Quelques affinages.
      '5': >-
        Modèle exemplaire : ERD et dictionnaire vivants, intégrité et index validés par EXPLAIN,
        classification et rétention par colonne, migrations versionnées testées, alignement ORM↔base garanti
        par CI, conventions Data de l'organisation respectées. Référence interne.
