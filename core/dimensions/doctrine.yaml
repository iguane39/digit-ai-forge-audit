      '3': >-
        Acteurs data identifiés et engagés, modèles validés, règles de gestion validées par le métier, Data
        Contract défini, plan de documentation catalogue de données d'entreprise établi. Conformité phase
        Conception atteinte ; phase Build à conduire.
      '4': >-
        Phase Build conforme : recette data validée, intégration plateforme de données de l'organisation
        effective, documentation catalogue de données d'entreprise complète, habilitations implémentées, cycle
