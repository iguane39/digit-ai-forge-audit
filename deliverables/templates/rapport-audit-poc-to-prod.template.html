<!DOCTYPE html>
<!--
  AuditCore — gabarit du rapport d'audit, forme POC-to-Prod (TF-2145, décision humaine D-171 (a) du 04/11/2026).
  Rendu PAR DÉFAUT de `tools/build-rapport.mjs`. Forme de référence : rapport d'audit POC-to-Prod de Produit-68
  (24/09/2026, pleine largeur, routage du schéma par ports et voies) et son modèle à champs ; seule la STRUCTURE, le
  moteur et le style en sont repris — aucune donnée. Agnostique : aucune marque, couleurs par les jetons du thème du
  tenant (theme.css), libellés par la langue du tenant.
  Ce fichier n'est pas un rapport : chaque champ entre doubles accolades est rempli par `tools/rapport-poc-to-prod.mjs`
  depuis rapport-data.json, de façon déterministe. Un champ laissé vide fait refuser le rendu (verifier-rapport-html).
-->
<html lang="{{LANG}}" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="auditcore-forme" content="poc-to-prod">
<meta name="forge-type-page" content="editoriale">
<script id="theme-init">
(function () {
  /* sans navigateur complet (porte de rendu, extraction du plan), aucune racine où poser le thème */
  if (typeof document === 'undefined' || !document.documentElement || typeof document.documentElement.setAttribute !== 'function') return;
  var stocke = null;
  try { stocke = window.localStorage.getItem('auditcore-theme'); } catch (e) {}
  var theme = stocke === 'dark' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', theme);
  var meta = typeof document.querySelector === 'function' ? document.querySelector('meta[name="color-scheme"]') : null;
  if (meta && meta.setAttribute) meta.setAttribute('content', theme);
})();
</script>
<title>{{TITRE_DOCUMENT}}</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<style>
{{CSS_THEME}}
{{CSS_SOMBRE}}
/* ==== Forme POC-to-Prod — couche sémantique, dérivée des jetons du tenant (aucune couleur littérale ici) ==== */
:root{
  --r-fond:var(--bg);--r-surface:var(--panel);--r-voile:color-mix(in srgb,var(--line) 42%,var(--bg));
  --r-trait:var(--line);--r-trait-2:color-mix(in srgb,var(--line) 62%,var(--muted));
  --r-encre:var(--txt);--r-encre-2:color-mix(in srgb,var(--txt) 82%,var(--muted));--r-attenue:var(--muted);
  --r-pale:color-mix(in srgb,var(--muted) 55%,var(--panel));--r-attenue-voile:color-mix(in srgb,var(--muted) 62%,var(--txt));--r-ombre:color-mix(in srgb,var(--txt) 14%,transparent);
  --r-rouge:var(--fatal);--r-rouge-fond:color-mix(in srgb,var(--fatal) 7%,var(--panel));--r-rouge-trait:color-mix(in srgb,var(--fatal) 20%,var(--panel));--r-rouge-encre:color-mix(in srgb,var(--fatal) 60%,var(--txt));
  --r-orange:var(--bloq);--r-orange-fond:color-mix(in srgb,var(--bloq) 7%,var(--panel));--r-orange-trait:color-mix(in srgb,var(--bloq) 22%,var(--panel));--r-orange-encre:color-mix(in srgb,var(--bloq) 60%,var(--txt));
  --r-ambre:var(--maj);--r-ambre-fond:color-mix(in srgb,var(--maj) 8%,var(--panel));--r-ambre-trait:color-mix(in srgb,var(--maj) 22%,var(--panel));--r-ambre-encre:color-mix(in srgb,var(--maj) 60%,var(--txt));
  --r-vert:var(--std);--r-vert-fond:color-mix(in srgb,var(--std) 7%,var(--panel));--r-vert-trait:color-mix(in srgb,var(--std) 20%,var(--panel));--r-vert-encre:color-mix(in srgb,var(--std) 60%,var(--txt));
  --r-bleu:var(--accent);--r-bleu-fond:color-mix(in srgb,var(--accent) 7%,var(--panel));--r-bleu-trait:color-mix(in srgb,var(--accent) 24%,var(--panel));--r-bleu-encre:color-mix(in srgb,var(--accent) 60%,var(--txt));
  --r-sarcelle:color-mix(in srgb,var(--std) 55%,var(--accent));--r-sarcelle-fond:color-mix(in srgb,var(--r-sarcelle) 8%,var(--panel));--r-sarcelle-trait:color-mix(in srgb,var(--r-sarcelle) 24%,var(--panel));--r-sarcelle-encre:color-mix(in srgb,var(--r-sarcelle) 60%,var(--txt));
  --r-violet:color-mix(in srgb,var(--accent) 55%,var(--fatal));--r-violet-fond:color-mix(in srgb,var(--r-violet) 7%,var(--panel));--r-violet-trait:color-mix(in srgb,var(--r-violet) 22%,var(--panel));--r-violet-encre:color-mix(in srgb,var(--r-violet) 60%,var(--txt));
  --r-titre:var(--font-head,var(--font-body));--r-texte:var(--font-body);--r-mono:var(--font-mono);
  --schema-fond:color-mix(in srgb,var(--bg) 55%,var(--panel));
  --focus-anneau:2px solid var(--accent);--focus-decalage:2px;
  --gouttiere:clamp(1.5rem,1.25vw,3rem);--dur-1:.15s;--ease:cubic-bezier(.2,0,0,1);
}
{{CSS_FAMILLES}}
[hidden]{display:none!important}
:where(a,button,input,select,[tabindex]):focus-visible{outline:var(--focus-anneau);outline-offset:var(--focus-decalage)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}
body{font-family:var(--r-texte);background:var(--r-surface);color:var(--r-encre);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--r-titre);font-weight:500;line-height:1.25}
code,.mono{font-family:var(--r-mono);font-size:.85em}
code{overflow-wrap:break-word}
a{color:var(--r-bleu-encre)}
input[type="text"],input[type="search"]{background:var(--r-surface);color:var(--r-encre);border:1px solid var(--r-trait-2)}
input::placeholder{color:var(--r-attenue)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lire{max-width:1080px;margin-left:auto;margin-right:auto}
.app{max-width:none;margin:0 auto;padding:0 var(--gouttiere) 4rem}
/* — en-tête — */
.header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--r-surface) 95%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--r-voile);padding:1rem var(--gouttiere);margin:0 0 2rem}
.header-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem}
.marque{display:flex;align-items:center;gap:.75rem}
.marque-texte .marque-titre{font-size:.95rem;font-weight:500}
.marque-texte p{font-size:.75rem;color:var(--r-attenue)}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{font-family:var(--r-texte);font-size:.8rem;padding:0 .9rem;min-height:36px;display:inline-flex;align-items:center;background:var(--r-surface);border:1px solid var(--r-voile);border-radius:6px;cursor:pointer;color:var(--r-encre);transition:border-color var(--dur-1) var(--ease)}
.btn:hover{border-color:var(--r-encre)}
.theme-toggle{appearance:none;border:1px solid var(--r-trait);background:var(--r-surface);color:var(--r-encre);border-radius:999px;width:36px;height:36px;flex:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.theme-toggle .icon-sun{display:none}
:root[data-theme="dark"] .theme-toggle .icon-moon{display:none}
:root[data-theme="dark"] .theme-toggle .icon-sun{display:inline}
/* — bloc titre — */
.title-block{padding:1.5rem 0;border-bottom:1px solid var(--r-voile);margin-bottom:2rem}
.title-block .label{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--r-attenue);margin-bottom:.5rem}
.title-block h1{font-size:1.85rem;font-weight:500;margin-bottom:.5rem}
.title-block .subtitle{font-size:1rem;color:var(--r-attenue);line-height:1.6}
.title-block .meta{display:flex;flex-wrap:wrap;gap:1.5rem;font-size:.85rem;color:var(--r-attenue);margin-top:1.2rem}
.title-block .meta strong{color:var(--r-encre);font-weight:500}
/* — bandeau du verdict — */
.gate-banner{display:flex;flex-wrap:wrap;align-items:center;gap:1rem;padding:1rem 1.4rem;border-radius:8px;margin-bottom:2rem;border:1px solid}
.gate-banner .verdict{flex:0 1 auto;min-width:0}
.gate-banner .gb-label{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.gate-banner .gb-verdict{font-family:var(--r-titre);font-size:1.55rem;font-weight:600;line-height:1.1}
.gate-banner .gb-chiffres{font-size:.78rem;opacity:.9;margin-top:4px}
.gate-banner .gb-desc{font-size:.86rem;line-height:1.55;flex:1 1 16rem;min-width:0}
.gate-banner.nogo{background:var(--r-rouge-trait);border-color:var(--r-rouge);color:var(--r-rouge-encre)}
.gate-banner.reserve{background:var(--r-ambre-trait);border-color:var(--r-orange);color:var(--r-ambre-encre)}
.gate-banner.go{background:var(--r-vert-trait);border-color:var(--r-vert-encre);color:var(--r-vert-encre)}
.gate{font:inherit;color:inherit}
/* — cartes de synthèse : tableau clé/texte rendu en grille de cartes — */
.summary-grid{width:100%;margin-bottom:2rem;border-collapse:separate}
.summary-grid thead,.summary-grid thead th{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.summary-grid tbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.summary-grid tbody tr{display:block;background:var(--r-surface);border:1px solid var(--r-voile);border-radius:8px;padding:1.1rem 1.25rem;border-top:3px solid var(--card-color,var(--r-encre))}
.summary-grid tbody th{display:inline-block;font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--r-attenue);margin-bottom:.55rem;font-weight:500;text-align:left}
.summary-grid td{display:block;font-size:.85rem;color:var(--r-encre-2);line-height:1.6}
.summary-grid .sc-title{font-size:1rem;font-weight:500;margin-bottom:.5rem;color:var(--r-encre)}
.summary-grid ul.sc-bullets{list-style:none;padding:0;margin:.4rem 0 0;display:flex;flex-direction:column;gap:.35rem}
.summary-grid ul.sc-bullets li{position:relative;padding-left:.95rem;font-size:.82rem;line-height:1.55}
.summary-grid ul.sc-bullets li::before{content:'';position:absolute;left:0;top:.5rem;width:5px;height:5px;border-radius:50%;background:var(--card-color,var(--r-encre));opacity:.8}
.summary-grid tr.sc-fonc{--card-color:var(--r-sarcelle-encre)}.summary-grid tr.sc-tech{--card-color:var(--r-encre-2)}.summary-grid tr.sc-audit{--card-color:var(--r-encre)}
@media (min-width:1000px){.summary-grid tbody{grid-template-columns:repeat(3,1fr)}}
@media (min-width:2400px){.summary-grid tbody{grid-template-columns:repeat(6,1fr)}}
/* — KPI (valeur, définition, repère de lecture) — */
.kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem}
.kpi{background:var(--r-surface);border:1px solid var(--r-voile);border-radius:8px;padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.3rem}
.kpi .k-label{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--r-attenue)}
.kpi .k-valeur{font-family:var(--r-titre);font-size:2.1rem;font-weight:600;line-height:1}
.kpi .k-valeur small{font-size:.9rem;color:var(--r-attenue);font-weight:500}
.kpi .kpi-d{font-size:.75rem;color:var(--r-attenue);line-height:1.4}
.kpi .k-repere{font-size:.75rem;color:var(--r-encre-2);background:var(--r-fond);border-radius:6px;padding:8px;line-height:1.45}
.kpi .k-action{font-size:.75rem;font-weight:600;color:var(--r-bleu-encre);text-decoration:none}
.kpi .kv-gate{font-size:1.5rem}
.kpi .kv-nogo,.kpi .kv-alerte{color:var(--r-rouge)}
.kpi .kv-reserve{color:var(--r-orange)}
.kpi .kv-go{color:var(--r-vert-encre)}
.kpi-radar{background:var(--r-surface);border:1px solid var(--r-voile);border-radius:8px;padding:.8rem .9rem}
.kpi-radar figcaption{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--r-attenue)}
.kpi-radar svg{width:100%;height:auto;max-height:220px}
.kpi-radar .radar-note{font-size:.72rem;color:var(--r-attenue)}
.radar .rlab{font-size:12px;fill:var(--r-encre-2)}
.kpi-blocklist{margin-top:.55rem;display:flex;flex-direction:column;gap:.35rem}
.kpi-block-chip{display:flex;align-items:center;gap:.45rem;padding:.35rem .55rem;border:1px solid var(--r-rouge-trait);background:var(--r-rouge-fond);border-radius:6px;cursor:pointer;font:inherit;font-size:.78rem;color:var(--r-encre);text-align:left;width:100%}
.kpi-block-chip:hover{border-color:var(--r-rouge)}
.kpi-block-chip .bid{font-family:var(--r-mono);font-weight:700;color:var(--r-rouge)}
.kpi-block-chip .bname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-block-chip .bscore{font-weight:700;color:var(--r-rouge);white-space:nowrap}
@media (max-width:1100px){.kpi-grid{grid-template-columns:1fr 1fr}}
/* — contrôle qualité — */
.qa-panel{border-radius:8px;padding:12px 16px;margin:0 0 1.5rem;font-size:.8rem;border:1px solid}
.qa-panel h4{margin:0 0 4px;font-size:.84rem;font-family:var(--r-titre);font-weight:700}
.qa-panel ul{margin:8px 0 0;padding-left:20px}.qa-panel li{margin:4px 0}
.qa-panel .qa-cat{font-weight:700;text-transform:uppercase;font-size:.72rem;letter-spacing:.02em}
.qa-ok{background:var(--r-vert-fond);border-color:var(--r-vert-trait);color:var(--r-vert-encre)}
.qa-ko{background:var(--r-rouge-fond);border-color:var(--r-rouge-trait);color:var(--r-rouge-encre)}
.qa-info{background:var(--r-voile);border-color:var(--r-trait);color:var(--r-encre-2)}
/* — chemins de lecture — */
.chemins{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,420px));gap:8px;margin:0 0 1.5rem;padding:0}
.chemin{font-size:.8rem;padding:12px;background:var(--r-surface);border:1px solid var(--r-voile);border-radius:8px;color:var(--r-encre-2)}
.chemin b{display:block;margin-bottom:4px;color:var(--r-encre)}
.chemins-titre{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--r-attenue);margin-bottom:8px}
/* — sommaire : bascule des vues — */
nav.toc{display:flex;flex-wrap:wrap;align-items:center;gap:0;max-width:100%;margin-bottom:1.5rem;padding:.25rem;background:var(--r-voile);border-radius:8px;border:1px solid var(--r-voile)}
.mode-btn{padding:.55rem 1rem;background:transparent;border:none;cursor:pointer;font-family:var(--r-texte);font-size:.85rem;color:var(--r-encre-2);border-radius:6px;display:flex;align-items:center;gap:.5rem;text-decoration:none;transition:background-color var(--dur-1) var(--ease)}
.mode-btn:hover{background:color-mix(in srgb,var(--r-surface) 60%,transparent)}
.mode-btn.active{background:var(--r-encre);color:var(--r-surface);box-shadow:0 1px 2px var(--r-ombre)}
.mode-btn .mb-meta{font-family:var(--r-mono);font-size:.7rem;color:var(--r-attenue-voile)}
.mode-btn.active .mb-meta{color:color-mix(in srgb,var(--r-surface) 70%,transparent)}
.toc-ecarts{margin-left:auto;padding:.55rem 1rem;font-size:.78rem;color:var(--r-attenue)}
section.vue{display:none}section.vue.active{display:block}
.ch-apprend{color:var(--r-attenue);font-size:.82rem;margin:0 0 1rem}
/* — familles et dimensions — */
.family-nav{display:flex;gap:.25rem;margin-bottom:1.5rem;padding:.3rem;background:var(--r-voile);border-radius:8px;overflow-x:auto}
.family-nav>*+*{border-left:1px solid var(--r-voile)}
.family-tab{flex:1;min-width:130px;padding:.7rem .9rem;background:transparent;border:none;cursor:pointer;font-family:var(--r-texte);font-size:.85rem;color:var(--r-encre-2);border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.family-tab:hover{background:color-mix(in srgb,var(--r-surface) 60%,transparent)}
.family-tab.active{background:var(--r-surface);color:var(--r-encre);box-shadow:0 1px 2px var(--r-ombre)}
.family-tab .ftab-name{font-weight:500}
.family-tab .ftab-meta{font-family:var(--r-mono);font-size:.7rem;color:var(--r-attenue-voile)}
.family-tab.active .ftab-meta{color:var(--family-color);font-weight:500}
.family-tab .ftab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--family-color);margin-right:.35rem;vertical-align:middle}
.family-tab .ftab-avg{font-family:var(--r-mono);font-size:.78rem;font-weight:600;color:var(--family-color);margin-top:.15rem}
.domain-nav{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid var(--r-voile)}
.domain-tab{padding:.5rem .9rem;background:var(--r-surface);border:1px solid var(--r-voile);border-radius:6px;cursor:pointer;font-family:var(--r-texte);font-size:.82rem;color:var(--r-encre-2);display:flex;align-items:center;gap:.5rem}
.domain-tab:hover{border-color:var(--r-encre)}
.domain-tab.active{background:var(--r-encre);color:var(--r-surface);border-color:var(--r-encre)}
.domain-tab .dtab-id{font-family:var(--r-mono);font-size:.72rem;color:var(--r-attenue)}
.domain-tab.active .dtab-id{color:color-mix(in srgb,var(--r-surface) 70%,transparent)}
.domain-tab .dtab-score{font-family:var(--r-mono);font-size:.72rem;font-weight:700;padding:.1rem .35rem;border-radius:3px}
.domain-tab.schema-tab{background:var(--r-voile);border-color:var(--r-bleu-trait)}
.domain-tab.schema-tab.active{background:var(--r-encre-2);border-color:var(--r-encre-2)}
.dtab-score.s1,.score-pill.s1{background:var(--r-rouge-trait);color:var(--r-rouge-encre)}
.dtab-score.s2,.score-pill.s2{background:var(--r-ambre-trait);color:var(--r-rouge-encre)}
.dtab-score.s3,.score-pill.s3{background:var(--r-ambre-trait);color:var(--r-ambre-encre)}
.dtab-score.s4,.dtab-score.s5,.score-pill.s4,.score-pill.s5{background:var(--r-vert-trait);color:var(--r-vert-encre)}
.dtab-score.s0,.score-pill.s0{background:var(--r-voile);color:var(--r-encre-2)}
.family-intro{background:var(--family-bg);border-left:1px solid var(--family-color);border-radius:0 8px 8px 0;padding:1.1rem 1.3rem;margin-bottom:1.5rem;font-size:.88rem;line-height:1.7;color:var(--r-encre-2)}
.family-intro h3{font-size:.95rem;color:var(--family-color);margin-bottom:.4rem;font-weight:600}
.domain-header{background:var(--r-surface);border:1px solid var(--r-voile);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem}
.domain-header .dh-meta{font-family:var(--r-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--family-color);margin-bottom:.4rem}
.domain-header .dh-titre{font-size:1.45rem;font-weight:500;margin-bottom:.5rem}
.domain-header .dh-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem}
.score-pill,.crit-pill,.gate-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .7rem;border-radius:20px;font-family:var(--r-mono);font-size:.75rem;font-weight:600;border:1px solid transparent}
.crit-pill.fatal{background:var(--r-encre);color:var(--r-surface)}
.crit-pill.bloquant{background:var(--r-rouge-trait);color:var(--r-rouge-encre)}
.crit-pill.majeur{background:var(--r-ambre-trait);color:var(--r-ambre-encre);border-color:var(--r-orange-trait)}
.crit-pill.standard,.crit-pill.absente{background:var(--r-surface);color:var(--r-encre-2);border-color:var(--r-voile)}
.gate-pill.nogo{background:var(--r-rouge);color:var(--r-surface)}
.gate-pill.reserve{background:var(--r-orange);color:var(--r-surface)}
.gate-pill.go{background:var(--r-vert-encre);color:var(--r-surface)}
.gate-pill.absente{background:var(--r-voile);color:var(--r-encre-2)}
.perimeter-block{background:var(--r-surface);border:1px solid var(--r-voile);border-left:1px solid var(--family-color);border-radius:6px;padding:.95rem 1.15rem;margin-bottom:1rem}
.perimeter-block .pb-label{font-family:var(--r-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--family-color);margin-bottom:.6rem;font-weight:500}

.audit-summary{background:var(--r-surface);border-radius:6px;padding:.95rem 1.15rem;font-size:.88rem;color:var(--r-encre-2);line-height:1.7;border-left:1px solid var(--family-color)}

/* — matrice de traçabilité — */

.tm-legend{margin:12px 0 0;font-size:12px;color:var(--tm-ink2);display:flex;gap:16px;flex-wrap:wrap}

}

}

<script>
/* ==== AuditCore — moteur de la forme POC-to-Prod (gabarit gd-rapport-audit-poc-to-prod) ====================
   Rend les vues interactives (rapport d'audit par famille et dimension, matrice de traçabilité, toutes les règles,
   plan de remédiation, reprise applicative, tests, analyses, composants), à l'identique côté serveur (rendu initial
   écrit dans le fichier par build-rapport) et dans le navigateur (filtres, tri, recherche, détail). Les données
   ci-dessous sont produites depuis rapport-data.json : rien n'est saisi à la main dans ce fichier. */
{{DONNEES_JS}}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
/* Libellé de la langue du rapport ; %1, %2… sont remplacés par les arguments suivants. */
function T(cle) {
  var s = Object.prototype.hasOwnProperty.call(I18N, cle) ? I18N[cle] : cle;
  for (var i = 1; i < arguments.length; i++) s = String(s).split('%' + i).join(String(arguments[i]));
  return s;
}
function surligne(texte, q) {
  var t = escapeHtml(texte == null ? '' : String(texte));
  if (!q) return t;
  var motif = String(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try { return t.replace(new RegExp('(' + motif + ')', 'ig'), '<mark class="adr-hl">$1</mark>'); } catch (e) { return t; }
}
/* Lit un bloc machine du fichier (<script type="application/json">). Bloc non servi (hôte sans DOM réel : porte de
   format tierce, rendu côté serveur) : la donnée embarquée dans ce moteur fait foi. Bloc servi mais illisible : null,
   et l'auto-test le dit — un bloc édité à la main ne passe pas en silence. */
function lireBloc(id, repli) {
  if (typeof document === 'undefined' || !document || typeof document.getElementById !== 'function') return repli;
  var e = document.getElementById(id);
  var t = e && typeof e.textContent === 'string' ? e.textContent : '';
  if (!t.trim()) return repli;
  try { return JSON.parse(t); } catch (err) { return null; }
}
function __auditJson(id) { return lireBloc(id, id === 'remediation-plan-json' ? PLAN_EMBARQUE : id === 'audit-selftest-data' ? FAITS_AUTOTEST : null); }
function idSur(s) { return String(s).replace(/[^\w-]/g, '_'); }
var ICO_ALERTE = '<svg class="ico-alerte" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 15 14H1L8 1Zm-.8 4.5v4.2h1.6V5.5H7.2Zm0 5.6v1.6h1.6v-1.6H7.2Z"/></svg>';
var VERDICTS = ['non_conforme', 'partiel', 'a_evaluer', 'conforme', 'sans_objet'];
var VCLS = { conforme: 'v-ok', partiel: 'v-part', non_conforme: 'v-ko', sans_objet: 'v-na', a_evaluer: 'v-todo' };
var VKEY = { conforme: 'ok', partiel: 'part', non_conforme: 'ko', sans_objet: 'na', a_evaluer: 'todo' };
var CRIT_ORDRE = { Fatal: 0, Bloquant: 1, Majeur: 2, Standard: 3 };
var PRIO_ORDRE = { urgent: 0, prio: 1, quick: 2, norm: 3 };
var SEV_ORDRE = { Fatal: 0, critique: 0, Bloquant: 1, Majeur: 2, majeur: 2, Standard: 3, mineur: 3 };
function verdictLib(v) { return T('verdict.' + (v || 'a_evaluer')); }
function sevClasse(s) { var o = SEV_ORDRE[s]; return o === 0 || o === 1 ? 's-grave' : o === 2 ? 's-majeur' : o === 3 ? 's-mineur' : 's-absente'; }

/* ---------- état ---------- */
var state = { mode: VUES.length ? VUES[0].mode : 'audit', family: FAMILIES.length ? FAMILIES[0].key : '', domain: ORDERED_DOMAINS.length ? ORDERED_DOMAINS[0] : '' };
(function () { for (var i = 0; i < FAMILIES.length; i++) if (FAMILIES[i].domains.length) { state.family = FAMILIES[i].key; state.domain = FAMILIES[i].domains[0]; return; } })();
var ADR_BYID = {}; ADRS.forEach(function (a) { ADR_BYID[a.id] = a; });
function adrResp(id) {
  var r = ADR_RESP[id] || {};
  return { verdict: r.verdict || 'a_evaluer', apportee: r.apportee || '', possible: r.possible || '', motif: r.motif || '', rem_id: r.rem_id || '',
    priorite: r.priorite || '', verification: r.verification || '', couvre: r.couvre || [], couverte_par: r.couverte_par || '', rem_id_porteuse: r.rem_id_porteuse || '' };
}
function adrIsBloquantActionable(a) {
  var r = adrResp(a.id);
  return (a.crit === 'Fatal' || a.crit === 'Bloquant') && (r.verdict === 'non_conforme' || r.verdict === 'partiel') && !!(r.rem_id || r.couverte_par);
}
function constatsDeRegle(id) {
  var out = [];
  ORDERED_DOMAINS.forEach(function (k) { (DOMAINS[k].constats || []).forEach(function (c, i) { if ((c.regles || []).indexOf(id) >= 0) out.push({ dom: k, i: i, c: c }); }); });
  return out;
}
function planParId() { var m = {}; buildRemediationPlan().forEach(function (a) { m[a.id] = a; }); return m; }

/* ================================================================================================
   VUE « RAPPORT D'AUDIT » : familles → dimensions → panneau (synthèse, matrice de traçabilité, plan).
   ================================================================================================ */
function moyenneFamille(f) {
  var s = f.domains.map(function (d) { return DOMAINS[d]; }).filter(function (d) { return d.applicability !== 'off' && typeof d.score === 'number'; });
  return s.length ? s.reduce(function (a, d) { return a + d.score; }, 0) / s.length : null;
}
function htmlFamilyNav() {
  return '<div class="family-nav" id="familyNav" role="group" aria-label="' + escapeHtml(T('famille.nav')) + '">' + FAMILIES.map(function (f) {
    var m = moyenneFamille(f);
    return '<button type="button" class="family-tab' + (state.family === f.key ? ' active' : '') + '" style="--family-color: var(--fam-' + f.key + ')" data-famille="' + escapeHtml(f.key) + '" aria-pressed="' + (state.family === f.key) + '">'
      + '<span class="ftab-name"><span class="ftab-dot"></span>' + escapeHtml(f.name) + '</span>'
      + '<span class="ftab-meta">' + f.domains.length + ' ' + escapeHtml(T('dim.abrege')) + ' · ' + f.domains.join(', ') + '</span>'
      + '<span class="ftab-avg">' + escapeHtml(m === null ? T('famille.sans_note') : T('famille.moyenne', m.toFixed(1))) + '</span></button>';
  }).join('') + '</div>';
}
function htmlDomainNav(f) {
  var tabs = f.domains.map(function (did) {
    var d = DOMAINS[did];
    var sc = typeof d.score === 'number' ? d.score : 0;
    return '<button type="button" class="domain-tab' + (state.domain === did ? ' active' : '') + '" data-domaine="' + did + '" aria-pressed="' + (state.domain === did) + '">'
      + '<span class="dtab-id">' + did + '</span><span>' + escapeHtml(d.name) + '</span><span class="dtab-score s' + sc + '">' + (sc ? sc : '—') + '</span></button>';
  }).join('');
  var schema = (f.key === FAMILLE_SCHEMA && ARCHITECTURE_SVG)
    ? '<button type="button" class="domain-tab schema-tab' + (state.domain === '__schema__' ? ' active' : '') + '" data-domaine="__schema__" aria-pressed="' + (state.domain === '__schema__') + '"><span aria-hidden="true">▦</span><span>' + escapeHtml(T('schema.onglet')) + '</span></button>'
    : '';
  return '<div class="domain-nav" data-nav-famille="' + escapeHtml(f.key) + '"' + (state.family === f.key ? '' : ' hidden') + '>' + tabs + schema + '</div>';
}
function htmlPills(d) {
  var sc = typeof d.score === 'number' ? d.score : 0;
  var crit = d.criticality ? '<span class="crit-pill ' + d.criticality + '">' + escapeHtml(T('crit.libelle', T('crit.' + d.criticality))) + '</span>'
    : '<span class="crit-pill absente">' + escapeHtml(T('crit.absente')) + '</span>';
  var gate = d.gate1b ? '<span class="gate-pill ' + d.gate1b + '">' + escapeHtml(T('gate1b.' + d.gate1b)) + '</span>' : '<span class="gate-pill absente">' + escapeHtml(T('gate1b.absente')) + '</span>';
  var score = d.applicability === 'off' ? '<span class="score-pill s0">' + escapeHtml(T('score.off')) + '</span>'
    : sc ? '<span class="score-pill s' + sc + '">' + escapeHtml(T('score.libelle', sc, T('score.cran.' + sc))) + '</span>' : '<span class="score-pill s0">' + escapeHtml(T('score.absent')) + '</span>';
  return '<div class="dh-pills">' + score + crit + gate + '</div>';
}
function htmlAuditSummary(d) {
  var puces = (d.audit_summary_bullets || []).map(function (b) { return '<li>' + b + '</li>'; }).join('');
  if (!puces) return '';
  return '<div class="audit-summary lire" data-mesure-lecture><span class="as-label">' + escapeHtml(T('dim.synthese')) + '</span><ul class="as-bullets">' + puces + '</ul></div>';
}
function htmlDomainPanel(did) {
  var d = DOMAINS[did], fam = FAMILIES.filter(function (f) { return f.key === d.familyKey; })[0];
  var perimetre = d.resume ? '<div class="perimeter-block"><h4 class="pb-label">' + escapeHtml(T(did === ORDERED_DOMAINS[0] ? 'dim.perimetre0' : 'dim.perimetre')) + '</h4><p>' + escapeHtml(d.resume) + '</p></div>' : '';
  var off = d.applicability === 'off' ? '<div class="dim-off">' + escapeHtml(T('dim.off', d.motif || T('dim.off_sans_motif'))) + '</div>' : '';
  var note = (d.note_da_bullets || []).length
    ? '<div class="note-da lire" data-mesure-lecture><p class="nda-titre">' + escapeHtml(T('dim.note_titre')) + '</p><div class="nda-inner"><span class="nda-label">' + escapeHtml(T('dim.note_label')) + '</span><ul>'
      + d.note_da_bullets.map(function (b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('') + '</ul></div></div>'
    : '';
  return '<div class="dom-slot" data-dom="' + did + '" data-famille="' + escapeHtml(d.familyKey) + '"' + (state.domain === did ? '' : ' hidden') + '>'
    + '<section class="dim" id="' + did + '">'
    + '<div class="domain-panel" style="--family-color: var(--fam-' + d.familyKey + '); --family-bg: var(--fam-' + d.familyKey + '-fill)">'
    + '<div class="family-intro lire" data-mesure-lecture><h3>' + escapeHtml(T('famille.titre', fam ? fam.name : d.family)) + '</h3><p>' + escapeHtml(fam ? fam.intro : '') + '</p></div>'
    + '<div class="domain-header"><div class="lire" data-mesure-lecture><div class="dh-meta">' + did + ' · ' + escapeHtml(d.family) + '</div>'
